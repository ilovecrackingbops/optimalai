<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    The Optimal AI mark. Same grammar as before the rename: a white glyph
    inside four scan-frame corners on near-black — the corners stay, because
    the app still scans; the mark inside changes from a peanut (Nut AI) to a
    bold upward peak, standing for "optimal": the best point on the curve,
    not just "more". A solid rounded chevron reads as a peak/checkmark at a
    glance and stays legible as a single thick silhouette at 60px.
  -->
  <rect width="1024" height="1024" fill="#0B0B0F"/>

  <!-- Scan-frame corners -->
  <g stroke="#FFFFFF" stroke-width="52" stroke-linecap="round" fill="none">
    <path d="M 150 385 L 150 220 Q 150 150 220 150 L 385 150"/>
    <path d="M 639 150 L 804 150 Q 874 150 874 220 L 874 385"/>
    <path d="M 874 639 L 874 804 Q 874 874 804 874 L 639 874"/>
    <path d="M 385 874 L 220 874 Q 150 874 150 804 L 150 639"/>
  </g>

  <!-- The peak. A single bold chevron, rounded joins/caps so it reads as one
       solid mark rather than two thin lines — the same visual weight the
       peanut had. -->
  <path stroke="#FFFFFF" stroke-width="126" stroke-linecap="round" stroke-linejoin="round" fill="none"
    d="M 305 636 L 512 340 L 719 636"/>
</svg>
