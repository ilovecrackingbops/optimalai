<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    The Optimal AI mark, scaled down and centered for Android's adaptive-icon
    safe zone (masks crop the outer ring to a circle/squircle/rounded square
    depending on OEM launcher). See icon.svg for the full-size version and the
    rationale for the mark itself.
  -->
  <g transform="translate(512 512) scale(0.60) translate(-512 -512)">

  <!-- Scan-frame corners -->
  <g stroke="#FFFFFF" stroke-width="52" stroke-linecap="round" fill="none">
    <path d="M 150 385 L 150 220 Q 150 150 220 150 L 385 150"/>
    <path d="M 639 150 L 804 150 Q 874 150 874 220 L 874 385"/>
    <path d="M 874 639 L 874 804 Q 874 874 804 874 L 639 874"/>
    <path d="M 385 874 L 220 874 Q 150 874 150 804 L 150 639"/>
  </g>

  <!-- The peak. -->
  <path stroke="#FFFFFF" stroke-width="126" stroke-linecap="round" stroke-linejoin="round" fill="none"
    d="M 305 636 L 512 340 L 719 636"/>
</g>
</svg>
